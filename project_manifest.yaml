id: marantz-audio-endpoint
name: Marantz
description: >
  Endpoint audio Lenovo/Ubuntu vers ampli Marantz : Spotify Connect et
  renderer DLNA sur le même endpoint ALSA (hôte lenovo-openclaw).
  Dépôt de design validé, plan d'exécution et notes d'intervention.
status: archived
owner: Michael Introligator
category: perso
tags: [audio, alsa, spotify-connect, dlna, ubuntu]

repo:
  type: github
  path: https://github.com/MadOff-33/Marantz
  default_branch: master

stack:
  - Documentation / runbook
  - Ubuntu (cible lenovo-openclaw)
  - ALSA
  - Spotify Connect
  - DLNA

launch_commands: []

# Documentation versionnée — remontée dans la base Notion « Procédures ».
docs:
  - key: audio-endpoint-report
    title: "Lenovo Audio Endpoint — Intervention Report"
    path: docs/audio-endpoint-report.md
    kind: runbook

test_commands: []

ai_modules: []

resume_prompt: |
  Tu reprends Marantz (endpoint audio Lenovo/Ubuntu : Spotify Connect + DLNA
  sur le même endpoint ALSA, sortie vers ampli Marantz).
  Commencer en LECTURE SEULE. Lire README.md, docs/ et notes/ avant toute action.
  Toute intervention sur l'hôte lenovo-openclaw exige un GO explicite.
  Proposer un plan court, montrer le diff, commit après validation.

decisions:
  - key: archive-2026-07-12
    title: >-
      Décision propriétaire (2026-07-12) : projet Marantz archivé — objectif
      atteint (endpoint audio validé), aucune migration WSL, source Windows
      conservée telle quelle avec ses notes locales.
    status: Validée

risks: []

sprints: []

# Motifs de fichiers sensibles : PRÉSENCE détectée uniquement, contenu jamais lu.
sensitive_files_hints:
  - .env
  - .env.bak_*
  - "*.pem"
  - "*.key"
